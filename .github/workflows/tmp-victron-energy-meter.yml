name: Temporary integration report

on:
  push:
    branches: [tmp-ci-victron-energy-meter]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: |
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          for d in http diagnostics websocket_api zeroconf usb modbus; do
            jq -r '.requirements[]?' "homeassistant/components/$d/manifest.json"
          done > /tmp/extra.txt
          uv pip install -e . -r requirements_test.txt -r /tmp/extra.txt \
            "git+https://github.com/jobhh/carlo-gavazzi-modbus" \
            ./_ci/victron-energy-meter > /tmp/install.txt 2>&1 || true
      - name: Report
        run: |
          set +e +o pipefail
          source .venv/bin/activate
          R=ci-report.txt
          I=homeassistant/components/victron_energy_meter
          T=tests/components/victron_energy_meter
          {
            echo "== install"; tail -30 /tmp/install.txt
            echo "== hassfest generate"; python -m script.hassfest --action generate 2>&1 | tail -40
            echo "== gen_requirements_all"; python -m script.gen_requirements_all 2>&1 | tail -20
            echo "== translations"; python -m script.translations develop --integration victron_energy_meter 2>&1 | tail -20
            echo "== ruff format"; ruff format $I $T 2>&1
            echo "== ruff check"; ruff check --fix $I $T 2>&1
            echo "== pytest (snapshot update)"; pytest $T --snapshot-update -q -p no:cacheprovider 2>&1 | tail -80
            echo "== pytest"; pytest $T -q -p no:cacheprovider --cov=homeassistant.components.victron_energy_meter --cov-report=term-missing 2>&1 | tail -120
            echo "== hassfest validate"; python -m script.hassfest --action validate 2>&1 | tail -60
            echo "== mypy"; mypy $I 2>&1 | tail -60
            echo "== pylint"; pylint $I 2>&1 | tail -60
          } > $R
      - name: Commit the result
        if: always()
        run: |
          set +e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git status --short | head -40 | while read -r l; do echo "::notice::status $l"; done
          git add -A -- ci-report.txt homeassistant tests requirements_all.txt \
            requirements_test_all.txt .github/CODEOWNERS 2>&1 | while read -r l; do echo "::warning::add $l"; done
          git diff --cached --stat | tail -5 | while read -r l; do echo "::notice::staged $l"; done
          git commit -q -m "Integration report" 2>&1 | while read -r l; do echo "::warning::commit $l"; done
          git push 2>&1 | while read -r l; do echo "::warning::push $l"; done
